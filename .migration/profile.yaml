# Migration profile for the public pilot: Eclipse Cargo Tracker (Java EE 7) → Python/Django.
# Bootstrap input; validated against schemas/profile.schema.json.
harness_version: 0.2.0
source:
  repo: eclipse-ee4j/cargotracker
  sha: f3beacf78de4f6d34edc4971ac87e38a5c6fe59d   # branch javaee7, 2021-01-02, MIT
  path: ""
  stacks: [java-8, java-ee-7, jsf-2.2, primefaces-8, cdi-1.1, ejb-3.2, jpa-2.1-eclipselink, jax-rs-2-jersey, jms-2, jbatch-1.0, payara-4, derby]
  encoding: UTF-8
target:
  repo: martins-vds/ai-factory-pilot-target
  stacks:
    backend: [python-3.13, django-5]
    frontend: [django-templates]
    data: [postgresql-17]
  architecture:
    adrs: []
characterization:
  tier: A
  reason: >-
    Verified with Java 8 and Payara Server 4.1.2.181: a scratch build of the
    pinned source was deployed and GET /cargo-tracker/ returned HTTP 200.
    `characterization/legacy-runtime/run-payara.sh` reproduces the probe using
    Maven Central only. The default Maven profile's Payara Arquillian test
    dependencies include five unavailable `2.29.payara-p3` Jersey artifacts;
    the runner disables that profile for packaging, and the full remote test
    suite remains blocked by those dependencies.
graph:
  tool: understand-anything
  commit: 4e6d3299017a7432da15957874992837a315c5b4
  patches: [understand-anything/argument-hint.patch]
  enrich: {source: [java-ee], target: [django]}       # ADR-0020: harness enrichers (stack pack graph block)
  require:                                             # types each side's graph must contain (graph_gate.py)
    source: {nodes: [table, page, endpoint], edges: [reads_from, writes_to, routes, calls]}
    target: {nodes: [table, endpoint], edges: [reads_from, writes_to, routes, calls]}
  target_paths: [src, templates]                       # ADR-0023: the target graph analyses these (templates hold pages)
risk_map:
  exclude: ["*.min.js", "*/webapp/resources/*", "*/soapui/*"]
skills:
  source:
    read: [java-docs]
    characterize: [java-junit]
  target:
    patterns: [django-patterns]
    security: [django-security]
    tdd: [django-tdd]
    verify: [django-verification]
    coverage: [pytest-coverage]
  specialists:
    data: [postgresql-code-review, postgresql-optimization]
gates:
  build: ["python -m compileall -q src", "python manage.py check"]
  idiom: ["ruff check", "ruff format --check"]
  tests: ["pytest -q"]
  crap: ["pytest -q --cov=src --cov-report=lcov:.migration/runs/crap.lcov", "lizard --csv src > .migration/runs/lizard.csv", "python .migration/harness/tools/crap.py .migration/runs/lizard.csv --lcov .migration/runs/crap.lcov --max 30"]
  mutation_changed: ["python .migration/harness/tools/afs-mutation --changed-since origin/main"]
  mutation_full: ["python .migration/harness/tools/afs-mutation --all"]
thresholds:
  crap_max_per_method: 30
  mutation_score_min: 0.8
concurrency:
  max_parallel_workers: 4
  remote_workers: true
context:
  working_budget: 0.45
  soft_limit: 0.6
rtk:
  edition: oss
  version: 1.1.0
data:
  masking: false
  snapshot_owner: martins-vds   # dispatches the AFS data snapshot workflow (#1, #223, ADR-0032)
  snapshot_java: "8"            # Payara 4.1 and the Derby exporter
  snapshot:                     # build, start, check and stop the legacy app, then export its Derby file
    - bash characterization/legacy-runtime/run-payara.sh
    - python .migration/harness/tools/data_snapshot.py export --jdbc-url 'jdbc:derby:/nonexistent/afs-drill-db' --driver org.apache.derby:derby:10.14.2.0@2c40eb581e5221ab33c7c796979b49ce404e7e393357c58f7bcdb30a09efca72 --engine derby --database cargo-tracker --out {out}
  load:
    - "python manage.py load_data_snapshot --snapshot {snapshot} --mapping .migration/data/mapping.yaml"
  export:
    - "python manage.py export_data_snapshot --mapping .migration/data/mapping.yaml --out {out}"
services:
  compose: compose.yaml   # real test services (harness ADR-0016)
  test: [db]
  env: {POSTGRES_DB: cargotracker}   # settings default; afs-mutation suffixes it per parallel worker
# costs:                     # ADR-0021: set to the account that pays for Copilot (operator-setup.md)
#   billing: {scope: organization, account: <org>}
translation_rules: .migration/translation-rules.md
signoff:                     # ADR-0031: whose approving review on the coordinator's PR is the human sign-off
  approvers: [martins-vds]
self_heal:                   # ADR-0034: the stop hook sends an agent back to fix what CI would reject
  enabled: true              # operator, 2026-11-07: "Enable self healing"
  max_blocks: 2
