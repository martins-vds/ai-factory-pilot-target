notes: "Default Cargo table fields include id/tracking_id and origin_id; embedded RouteSpecification uses spec_origin_id, spec_destination_id, spec_arrival_deadline. Embedded Delivery maps transport_status, last_known_location_id, current_voyage_id, misdirected, eta, next_expected_handling_event_type, next_expected_location_id, next_expected_voyage_id, unloaded_at_dest, routing_status, calculated_at, last_event_id. The page uses all listed delivery fields except calculated_at/last_event_id; JpaCargoRepository.find uses Cargo.findByTrackingId. persistence.xml configures CargoTrackerUnit with java:app/jdbc/CargoTrackerDatabase and schema generation action create. Target date-only values are represented as UTC midnight. TC-05 maps Delivery.lastEvent to the HandlingEventRecord foreign key on last_event_id. Seeded delivery snapshots must agree with the history: MNO456 ends in CLAIM and is not unloaded at destination."
