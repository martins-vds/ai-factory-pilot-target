notes: >-
  HandlingEvent maps type, voyage_id, location_id, completionTime, registration and cargo_id.
  The JPA repository stores events and reads the named HandlingEvent.findByTrackingId query.
  HandlingEventTest and HandlingHistoryTest cover domain behavior, not repository persistence;
  no direct source repository test was identified. Approved target divergence #171 preserves
  full UTC completion and registration instants after reload, rather than reproducing the source's
  DATE-column loss described in research PR #173. The migration maps existing dates to UTC
  midnight; reversing it necessarily loses sub-day precision.
