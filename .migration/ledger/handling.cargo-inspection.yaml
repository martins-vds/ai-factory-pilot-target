notes: >-
  If the cargo is missing, inspection logs a warning and returns. Delivery derives its last
  event from HandlingHistory.getMostRecentlyCompletedEvent; transport status, last known
  location, current voyage, misdirection, ETA, next activity and unloaded-at-destination
  are recomputed. CargoTest.testIsMisdirected and testIsUnloadedAtFinalDestination cover
  outcomes; CargoLifecycleScenarioTest includes lifecycle behavior. Decision #87 combines
  registration and inspection in one target transaction and removes the source consistency
  window. HR-04D implements both outcomes as independent log lines and uses ruling #136 for
  equal-completion-time events.
