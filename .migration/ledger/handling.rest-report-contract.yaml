notes: >-
  HandlingReport.java:13-26 defines the field constraints. Completion time is parsed as
  yyyy-MM-dd HH:mm; ParseException is rethrown as RuntimeException and unknown eventType
  fails at valueOf, so those failures are server errors in the source. The endpoint does not
  check cargo, voyage or location references. The void method has no response entity.
  Decision #88 specifies the target's 204 acceptance, 400 field errors for malformed reports,
  UTC interpretation and worker-side reference checks. No dedicated source REST/DTO test
  was identified. Lizard did not emit a method for HandlingReportService.java; the recorded
