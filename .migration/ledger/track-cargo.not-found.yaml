notes: "Chain: public.track EL resolves the @Named/@ViewScoped Track bean; CDI injects CargoRepository/JpaCargoRepository and HandlingEventRepository/JpaHandlingEventRepository, which return Cargo and HandlingHistory for CargoTrackingViewAdapter. JpaCargoRepository.find returns null when Cargo.findByTrackingId has no result. The page/template have no h:messages component; its empty-events label is also eligible to render when cargo is null while its value references cargo.trackingId. See .migration/quirks/track-cargo-not-found-message.md. No legacy UI/bean test edge; risk is Track.onTrackById, coverage input unavailable."
