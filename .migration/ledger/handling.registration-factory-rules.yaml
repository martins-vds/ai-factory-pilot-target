notes: >-
  A missing cargo is returned as null by JpaCargoRepository and becomes UnknownCargoException.
  The factory's null checks for voyage/location would create typed errors, but the production
  JpaVoyageRepository.find and JpaLocationRepository.find use getSingleResult without handling
  NoResultException, so missing voyage/location references escape as JPA exceptions instead.
  The event constructor enforces LOAD/UNLOAD require a voyage and other types prohibit one.
  CargoLifecycleScenarioTest contains invalid-reference scenario code; no dedicated factory
  unit test was identified. Decision #95 defines target rejection reason codes for unknown
  references; #88 leaves reference checks to the worker. Target rejection reason codes are
  UNKNOWN_CARGO, UNKNOWN_LOCATION, UNKNOWN_VOYAGE, and INVALID_EVENT.
