# Track Cargo slice: entry points that must reach data through the directed flow (ADR-0020, graph_gate.py).
epic: 9                                          # slice epic (ADR-0022: closing it opens the fog re-walk)
data_paths:
  source:
    - src/main/webapp/public/track.xhtml        # public tracking page → Track bean → repositories
    - src/main/webapp/admin/tracking/track.xhtml # admin tracking page
  target:
    - endpoint=/                                 # tracking page (compose_tracking_view)
entry_points:                                    # ADR-0026: target entry points this slice owns beyond its anchors
  target:
    - endpoint=/tracking/map/                    # the map frame, an iframe whose URL is built in code
    - command=seed_sample_data                   # TC-06: reproduces SampleDataGenerator
