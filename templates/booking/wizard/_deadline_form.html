<form
  id="deadline-form"
  method="post"
  action="/booking/"
  hx-post="/booking/"
  hx-trigger="change from:#arrival-deadline"
  hx-target="#deadline-form"
  hx-swap="outerHTML"
  class="flex flex-col gap-6"
>
  {% csrf_token %}
  <input type="hidden" name="step" value="deadline">
  <input type="hidden" name="origin" value="{{ origin.unlocode.value }}">
  <input type="hidden" name="destination" value="{{ destination.unlocode.value }}">
  <section class="rounded-box rounded-lg border border-base-300 border-slate-300 bg-white p-6 shadow-sm">
    <label class="label mb-1 block font-medium text-slate-800" for="arrival-deadline">Arrival deadline</label>
    <input
      class="input input-bordered w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-blue-600"
      type="date"
      id="arrival-deadline"
      name="deadline"
      min="{{ today|date:'Y-m-d' }}"
      value="{{ deadline_value }}"
      aria-describedby="deadline-state{% if deadline_error %} deadline-error{% endif %}"
      {% if deadline_error %}aria-invalid="true"{% endif %}
    >
    {% if deadline_error %}
      <p class="mt-2 text-red-700" id="deadline-error">{{ deadline_error }}</p>
    {% endif %}
    <div id="deadline-state" aria-live="polite" class="mt-3">
      {% if duration == 0 %}
        <p>A journey can't start and end the same day!</p>
      {% elif duration == 1 %}
        <p>Journey duration is one day.</p>
      {% elif duration > 1 %}
        <p>Journey duration is {{ duration }} days.</p>
      {% endif %}
    </div>
  </section>
  <nav aria-label="Wizard actions" class="flex justify-end gap-3">
    <button class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" type="submit" name="action" value="back">Back</button>
    <button class="btn btn-ghost min-h-11 rounded-md px-5 py-2 font-semibold text-slate-800 hover:bg-slate-100" type="submit" name="action" value="cancel">Cancel</button>
    <button
      class="btn btn-primary min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50"
      id="book-cargo"
      type="submit"
      name="action"
      value="book"
      {% if not bookable %}disabled{% endif %}
    >Book Cargo</button>
  </nav>
</form>
