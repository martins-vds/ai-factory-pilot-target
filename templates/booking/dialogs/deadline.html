<form
  id="deadline-dialog-form"
  method="post"
  action="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-post="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
  hx-target="#cargo-edit-dialog-content"
  hx-swap="innerHTML"
  class="space-y-5"
>
  {% csrf_token %}
  <div>
    <h2 class="mb-4 text-xl font-semibold" id="cargo-edit-dialog-title">Change arrival deadline</h2>
    <p>Origin: {{ cargo.route_specification.origin.name }}</p>
    <p>Destination: {{ cargo.route_specification.destination.name }}</p>
  </div>
  <div>
    <label class="mb-1 block font-medium" for="arrival-deadline">Arrival deadline</label>
    {% if deadline_error %}
      <p class="mb-2 text-red-700" id="deadline-error" role="alert">{{ deadline_error }}</p>
    {% endif %}
    <input
      class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 focus-visible:ring-2 focus-visible:ring-blue-600"
      id="arrival-deadline"
      name="deadline"
      type="date"
      value="{{ deadline_value }}"
      required
      autofocus
      {% if deadline_error %}aria-invalid="true" aria-describedby="deadline-error"{% endif %}
    >
  </div>
  <div class="flex justify-end gap-3">
    <button
      class="min-h-11 rounded-md px-4 py-2 font-semibold text-slate-800 hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-blue-600"
      type="button"
      data-dialog-close
    >
      Cancel
    </button>
    <button
      class="min-h-11 rounded-md bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:ring-2 focus-visible:ring-blue-600"
      type="submit"
    >
      Update
    </button>
  </div>
</form>
