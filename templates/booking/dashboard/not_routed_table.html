<section id="not-routed-cargo" aria-labelledby="not-routed-cargo-heading">
  <h2 id="not-routed-cargo-heading" class="mb-3 text-xl font-semibold text-gray-900">Not Routed Cargo</h2>
  <div class="overflow-x-auto">
    <table class="w-full border-collapse text-left">
      <thead>
        <tr class="border-b border-gray-300">
          <th scope="col" class="p-3">Tracking ID</th>
          <th scope="col" class="p-3">Origin</th>
          <th scope="col" class="p-3">Destination</th>
          <th scope="col" class="p-3">Deadline</th>
        </tr>
      </thead>
      <tbody>
        {% for cargo in not_routed_cargos %}
          <tr class="border-b border-gray-200" data-tracking-id="{{ cargo.tracking_id.value }}">
            <td class="p-3">
              <a
                href="/admin/cargo/{{ cargo.tracking_id.value }}/route/"
                title="This cargo is not routed. Click on its tracking ID to route it!"
              >
                {{ cargo.tracking_id.value }}
              </a>
            </td>
            <td class="p-3">
              {{ cargo.route_specification.origin.name }}<br>
              <span class="text-sm text-gray-600">{{ cargo.route_specification.origin.unlocode.value }}</span>
            </td>
            <td class="p-3">
              <button
                class="min-h-11 rounded px-2 py-1 text-left hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-blue-600"
                type="button"
                hx-get="/admin/cargo/{{ cargo.tracking_id.value }}/destination/"
                hx-target="#cargo-edit-dialog-content"
                hx-swap="innerHTML"
                aria-controls="cargo-edit-dialog"
                aria-haspopup="dialog"
                aria-label="Change destination for cargo {{ cargo.tracking_id.value }}"
              >
                {{ cargo.route_specification.destination.name }}<br>
                <span class="text-sm text-gray-600">{{ cargo.route_specification.destination.unlocode.value }}</span>
              </button>
            </td>
            <td class="p-3">
              <button
                class="min-h-11 rounded px-2 py-1 text-left hover:bg-slate-50 focus-visible:ring-2 focus-visible:ring-blue-600"
                type="button"
                hx-get="/admin/cargo/{{ cargo.tracking_id.value }}/deadline/"
                hx-target="#cargo-edit-dialog-content"
                hx-swap="innerHTML"
                aria-controls="cargo-edit-dialog"
                aria-haspopup="dialog"
                aria-label="Change arrival deadline for cargo {{ cargo.tracking_id.value }}"
              >
                {{ cargo.route_specification.arrival_deadline|date:"m/d/Y" }}
              </button>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  <dialog
    class="max-h-[90vh] w-full max-w-lg rounded-lg p-6 shadow-xl backdrop:bg-black/50"
    id="cargo-edit-dialog"
    aria-labelledby="cargo-edit-dialog-title"
  >
    <div id="cargo-edit-dialog-content" aria-live="polite">
      <p role="status">Loading cargo editor…</p>
    </div>
  </dialog>
  <script>
    document.body.addEventListener('htmx:beforeRequest', (event) => {
      if (event.detail.target.id === 'cargo-edit-dialog-content') {
        const dialog = document.getElementById('cargo-edit-dialog');
        if (!dialog.open) dialog.showModal();
      }
    });
    document.body.addEventListener('htmx:afterSwap', (event) => {
      if (event.detail.target.id === 'cargo-edit-dialog-content') {
        event.detail.target.querySelector('[autofocus]')?.focus();
      }
    });
    document.body.addEventListener('click', (event) => {
      if (event.target.closest('[data-dialog-close]')) {
        document.getElementById('cargo-edit-dialog').close();
      }
    });
  </script>
</section>
