[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cargotracker.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=cargotracker --cov-report=lcov:coverage.lcov"

[tool.coverage.run]
branch = true
source = ["cargotracker"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
include = ["manage.py", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.format]
quote-style = "single"

[tool.mutmut]
paths_to_mutate = "src/cargotracker/location/,src/cargotracker/voyage/"
paths_to_exclude = "migrations"
tests_dir = "tests/"
runner = "python -m pytest -q --continue-on-collection-errors"
